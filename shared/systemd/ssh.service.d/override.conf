# airgenome — host sshd 우선순위 상승 drop-in.
# 설치: sudo mkdir -p /etc/systemd/system/ssh.service.d/
#       sudo cp shared/systemd/ssh.service.d/override.conf \
#               /etc/systemd/system/ssh.service.d/airgenome.conf
#       sudo systemctl daemon-reload
#       sudo systemctl restart ssh
#
# Why: bare metal hexa drill/blowup 이 CPU 전량 점유하면 host sshd 가 banner
#      응답조차 못 내고 Mac 쪽에서 "Connection timed out" 으로 오인. drill 은
#      shared/systemd/drill.slice (CPUWeight=100) 로 격하, sshd 는 CPUWeight
#      10000 으로 최우선 → Mac 세션 무결성 보장.
#
# 주의: Ubuntu 24.04 는 서비스명이 `ssh.service` (alias). systemd 버전에 따라
#       `sshd.service` 로도 심볼릭. 둘 다 동일 drop-in 경로에 두면 안전.

[Service]
CPUWeight=10000
IOWeight=10000
Nice=-5

# sshd 가 OOM killer 1순위에서 빠지도록
OOMScoreAdjust=-900
