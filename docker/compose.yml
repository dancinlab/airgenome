# airgenome — local dev/test compose. 프로덕션은 systemd unit 으로 배포 (shared/systemd/).
# 사용: docker compose -f docker/compose.yml up -d airgenome-claude
#      docker compose -f docker/compose.yml exec airgenome-claude claude

name: airgenome

services:
  airgenome-claude:
    image: ghcr.io/need-singularity/airgenome:dev
    container_name: airgenome-claude
    restart: unless-stopped
    # 입력렉 방지 L2 — cpuset + shares + memory-swap=동일 (swap 차단)
    cpu_shares: 2048
    cpuset: "0,1,8,9"   # SMT 페어, 16-thread 가정
    pids_limit: 512
    mem_limit: 8g
    memswap_limit: 8g
    # TUI: stdin_open + tty + init (tini)
    init: true
    stdin_open: true
    tty: true
    # bind mounts — credentials / runtime state / code / tmp / fuse
    volumes:
      - type: bind
        source: ${HOME}/.airgenome
        target: /root/.airgenome
      - type: bind
        source: ${HOME}
        target: /mac_home
        bind:
          propagation: rshared
      # creds bind — 프로덕션은 bin/airgenome-claude-run 이 accounts.json SSOT
      # 를 읽어 동적 생성 (compose 는 glob 미지원). 로컬 테스트 시 필요하면
      # `extra_hosts`/override 파일에 수동 bind 추가하거나 run 스크립트를 직접 실행.
      # See: shared/systemd/airgenome-claude.service
      # code SSOT (Mac sshfs target → container bind)
      - type: bind
        source: ${AIRGENOME_ROOT:-${HOME}/Dev/airgenome}
        target: /workspace/airgenome
      # authorized_keys → 컨테이너 내부 sshd (port 2222) PubkeyAuth
      # 없어도 컨테이너는 뜸 (sshd 는 인증만 불가). production 은 run 스크립트가 처리.
      - type: bind
        source: ${HOME}/.airgenome/docker_authorized_keys
        target: /root/.ssh/authorized_keys
        read_only: true
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN   # sshfs 요구
    security_opt:
      - apparmor:unconfined   # sshfs 내부 mount 허용
    environment:
      TERM: xterm-256color
      LANG: C.UTF-8
      CLAUDX_HOME_MAP: "/Users/ghost:/mac_home"
      NODE_OPTIONS: "--max-old-space-size=4096"
      TZ: Asia/Seoul
    # keystroke RTT 악화 방지 — host network 로 ssh 홉 1개 줄임
    network_mode: host
    command: ["claude"]
